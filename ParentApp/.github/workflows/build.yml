name: Build Parent App APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # google-services.json TIDAK boleh disimpan di repo publik (berisi Firebase project config).
      # Simpan isinya sebagai GitHub Secret bernama GOOGLE_SERVICES_JSON (base64-encoded),
      # lalu workflow ini akan menuliskannya kembali sebelum build.
      - name: Tulis google-services.json dari secret
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > app/google-services.json

      - name: Grant execute permission untuk gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: parent-app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
